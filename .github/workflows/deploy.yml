name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'mission_vardi_backend/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup and Restart Backend
        run: |
          # The runner is already inside your EC2 instance, so we just enter the backend directory
          cd mission_vardi_backend
          
          # Setup python environment
          python3 -m venv .venv
          source .venv/bin/activate
          
          # Install dependencies
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # --- ADD YOUR RESTART COMMAND HERE ---
          # Restart using your ecosystem.config.js
          pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js
          
          echo "Deployment successful!"
