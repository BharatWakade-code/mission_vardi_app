name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'mission_vardi_backend/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup and Restart Backend
        run: |
          # The runner is already inside your EC2 instance, so we just enter the backend directory
          cd mission_vardi_backend
          
          # Setup python environment
          python3 -m venv .venv
          source .venv/bin/activate
          
          # Install dependencies
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # --- ADD YOUR RESTART COMMAND HERE ---
          # Depending on how you run your server, uncomment or adjust the line below:
          # pkill -f uvicorn || true
          # nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          
          echo "Deployment successful!"
