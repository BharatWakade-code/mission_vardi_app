name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'mission_vardi_backend/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup and Restart Backend
        run: |
          # The runner is already inside your EC2 instance, so we just enter the backend directory
          cd mission_vardi_backend
          
          # Setup python environment
          python3 -m venv .venv
          source .venv/bin/activate
          
          # Install dependencies
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # --- ADD YOUR RESTART COMMAND HERE ---
          # If you use PM2, restart it here. Make sure the PM2 name matches what you originally named it!
          pm2 restart all || pm2 start "uvicorn app.main:app --host 0.0.0.0 --port 8000" --name "mission_vardi_backend"
          
          echo "Deployment successful!"
