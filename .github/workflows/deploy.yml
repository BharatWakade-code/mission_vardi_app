name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'mission_vardi_backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup and Restart Backend
        run: |
          cd mission_vardi_backend

          # Capture absolute path of the backend directory
          BACKEND_DIR=$(pwd)
          echo "Backend directory: $BACKEND_DIR"
          
          # Setup python environment
          python3 -m venv .venv
          source .venv/bin/activate
          
          # Install dependencies
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # Stop old process if running (ignore error if not found)
          pm2 delete mission-vardi-backend 2>/dev/null || true
          
          # Start with absolute paths so PM2 can always find uvicorn
          pm2 start "$BACKEND_DIR/.venv/bin/uvicorn" \
            --name mission-vardi-backend \
            --interpreter none \
            -- app.main:app --host 0.0.0.0 --port 8000
          
          # Save process list so PM2 restores it on server reboot
          pm2 save
          
          echo "Deployment successful!"
          pm2 list
